[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "videoforge-agent"
version = "0.1.0"
description = "A reviewable, FFmpeg-first agent for automatic video editing and publishing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "VideoForge Agent contributors" }]
keywords = ["video", "ffmpeg", "agent", "automation", "publishing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
youtube = [
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
]
webhook = ["httpx>=0.27,<1"]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
videoforge = "videoforge_agent.cli:app"

[project.urls]
Documentation = "https://github.com/lionelandrcuccitini-droid/videoforge-agent#readme"
Issues = "https://github.com/lionelandrcuccitini-droid/videoforge-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_agent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["videoforge_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["videoforge_agent"]
